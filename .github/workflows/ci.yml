name: 🛡️ Le Bouclier de Production

# Déclencheur : s'active sur chaque Pull Request vers main
on:
  pull_request:
    branches:
      - main

jobs:
  bouclier-ci:
    name: Vérification & Tests
    runs-on: ubuntu-latest   # Environnement Linux/Ubuntu

    steps:
      # ── Étape 1 : Récupérer le code ──────────────────────────────────
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      # ── Étape 2 : Configurer Python ───────────────────────────────────
      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Étape 3 : Installer les dépendances ───────────────────────────
      - name: 📦 Installer les dépendances (flake8 + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      # ── Étape 4 : Linter (vérification de syntaxe) ───────────────────
      - name: 🔍 Vérification de syntaxe avec Flake8
        run: |
          # Arrête le pipeline si des erreurs de syntaxe critiques sont trouvées
          # E9xx = erreurs de syntaxe, F63x = erreurs logiques fatales
          # F7xx = erreurs de syntaxe AST, F82x = variables non définies
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avertissements de style (longueur de ligne max 127, complexité max 10)
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      # ── Étape 5 : Tests unitaires ─────────────────────────────────────
      - name: 🧪 Exécuter les tests unitaires avec Pytest
        run: |
          pytest test_campus_event.py -v --tb=short
